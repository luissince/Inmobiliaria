name: Docker Image CI

on:
  push:
    branches: [ "master" ]

jobs:

  build-front-end:
    name: Front-End (ReactJs)
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: front-end

    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Crear archivo .env
        run: |
          cat > app/.env <<EOL
          VITE_APP_END_POINT="${{secrets.VITE_APP_END_POINT}}"
          VITE_APP_URL="${{secrets.VITE_APP_URL}}"
          VITE_APP_IMAGE="${{secrets.VITE_APP_IMAGE}}"
          VITE_APP_ENV="${{secrets.VITE_APP_ENV}}"
          VITE_APP_VERSION="${{secrets.VITE_APP_VERSION}}"
          EOL

      - name: Build container App React
        run: docker compose -f app/docker-compose.build.yml build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Tag front-end image
        run: docker tag front-end-react ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/inmobiliaria:latest

      - name: Push front-end image to ECR
        run: docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/inmobiliaria:latest